# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8082}

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/url_shortener_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# "update" auto-creates/alters tables without dropping existing data.
# Use "validate" in production once schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── App-specific ─────────────────────────────────────────────────────────────
# Base URL used to build the full short link returned in API responses.
# Override via env var BASE_URL in production.
app.base-url=${BASE_URL:http://localhost:8082}
